[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vfl-ies"
version = "0.1.0"
description = "Multi-energy vertical federated learning with configurable forward encryption"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "torch>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
vfl-ies = "vfl_ies.cli:main"

[tool.setuptools.packages.find]
include = ["vfl_ies*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
